# fly.toml app configuration file generated for nfl-analytics-hub on 2026-07-22T05:12:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nfl-analytics-hub'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'
  release_command = 'flask --app app db upgrade'

[env]
  APP_ENV = 'production'
  DATA_DIR = '/app/data'
  SEED_DATA_DIR = '/app/seed-data'
  ENABLED_PROVIDERS = 'nflverse,nws,the-odds-api'
  ENABLE_EXTERNAL_SYNC = 'false'
  ENABLE_COMMERCIAL_SYNC = 'false'
  ENABLE_ODDS_API = 'true'
  ENABLE_SCHEDULER = 'false'
  ENABLE_GAME_MARKET_REFRESH = 'true'
  ENABLE_WAREHOUSE_RETENTION = 'false'
  SCHEDULER_EXPECTED = 'true'
  PORT = '8080'
  WEATHER_PROVIDER = 'nws'
  V45_DELIVERY_TTL_SECONDS = '604800'
  P45_SCHEDULER_TICK_MINUTES = '5'
  P45_REFRESH_HORIZON_HOURS = '168'
  P45_FAR_REFRESH_MINUTES = '120'
  P45_MEDIUM_REFRESH_MINUTES = '30'
  P45_NEAR_REFRESH_MINUTES = '10'
  P45_IMMINENT_REFRESH_MINUTES = '5'
  P45_MAX_TARGETED_REQUESTS = '2'
  WAREHOUSE_RETENTION_INTERVAL_MINUTES = '1440'
  WAREHOUSE_RAW_RETENTION_DAYS = '180'
  WAREHOUSE_RAW_VERSIONS_PER_ENTITY = '5'
  WAREHOUSE_SYNC_RUN_RETENTION_DAYS = '180'
  WAREHOUSE_SYNC_RUNS_PER_SOURCE = '25'
  WAREHOUSE_RESOLVED_QUALITY_RETENTION_DAYS = '90'
  WAREHOUSE_RETENTION_BATCH_SIZE = '5000'

[processes]
  web = 'gunicorn app:app -c gunicorn_conf.py'
  worker = "sh -c 'ENABLE_SCHEDULER=true python scheduler_service.py'"
  delivery = 'python delivery_worker.py'

[[mounts]]
  source = 'nfl_data'
  destination = '/app/data'
  processes = ['web']

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['web']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 60
    soft_limit = 40

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '1m30s'
    method = 'GET'
    path = '/ready'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  processes = ['web']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  processes = ['worker']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['delivery']
