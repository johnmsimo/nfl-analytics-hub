<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sign in · NFL Analytics Hub</title><link rel="stylesheet" href="/static/theme.css"></head><body class="login-page"><main class="login-wrap"><section class="login-card"><div class="ai-brand login-brand"><span class="ai-mark">N</span><span>NFL ANALYTICS<small>AI Intelligence Hub</small></span></div><h1>Welcome back</h1><p>Sign in to access analytics, projections, and your private tracker.</p><form id="login-form"><label>Username<input id="username" autocomplete="username" required autofocus></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><label id="otp-field" hidden>Verification code<input id="otp" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" aria-describedby="otp-help"></label><p id="otp-help" hidden>Enter the 6-digit code from your authenticator app.</p><button class="btn primary" type="submit">Sign in</button><p id="login-error" class="login-error" role="alert"></p></form></section></main><script>
const next=new URLSearchParams(location.search).get('next')||'/';const form=document.getElementById('login-form'),otpField=document.getElementById('otp-field'),otpHelp=document.getElementById('otp-help'),otp=document.getElementById('otp');form.onsubmit=async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button'),err=document.getElementById('login-error');b.disabled=true;b.textContent=otpField.hidden?'Signing in…':'Verifying…';err.textContent='';const payload={username:document.getElementById('username').value,password:document.getElementById('password').value,next};if(!otpField.hidden)payload.otp=otp.value;try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(d.mfa_required){otpField.hidden=false;otpHelp.hidden=false;otp.required=true;otp.focus();b.disabled=false;b.textContent='Verify & sign in';return}if(!r.ok)throw new Error(d.error||'Sign-in failed');location.href=d.next||'/'}catch(x){err.textContent=x.message;b.disabled=false;b.textContent=otpField.hidden?'Sign in':'Verify & sign in'}};
</script></body></html>
