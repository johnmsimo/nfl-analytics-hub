<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Hub · NFL Analytics Hub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/theme.css"><script src="/static/app.js" defer></script></head>
<body><main class="wrap"><section class="ai-page">
  <header class="ai-pagehead"><div><h1>My Hub</h1><p>Definitive NFL decisions, projections, matchup context, and transparent price status.</p></div><div class="ai-controls" id="controls"></div></header>
  <div class="ai-grid" id="dashboard-grid"><div class="ai-card ai-insight ai-empty">Loading My Hub…</div></div>
</section></main>
<script>
document.addEventListener('DOMContentLoaded',async()=>{
 const {$,esc,pc,fetchJSON,shell,weekControls,headshot,teamLogo}=NFLHub;shell('dashboard');
 await weekControls($('#controls'),load);
 function finite(v){return v!==null&&v!==''&&Number.isFinite(Number(v))}
 function pct(v){return finite(v)?Math.round(Number(v)*100)+'%':'—'}
 function number(v,digits=1){return finite(v)?Number(v).toFixed(digits):'—'}
 function spark(values){if(!values?.length||values.length<2)return'';const w=380,h=140,min=Math.min(...values),max=Math.max(...values),d=Math.max(max-min,1);const pts=values.map((v,i)=>`${i*w/(values.length-1)},${h-15-(v-min)/d*(h-35)}`).join(' ');return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><g stroke="rgba(148,163,184,.12)">${[30,65,100].map(y=>`<line x1="0" x2="${w}" y1="${y}" y2="${y}"/>`).join('')}</g><polyline fill="none" stroke="url(#g)" stroke-width="3" points="${pts}"/></svg>`}
 function kpiStatus(d,key){return d.kpi_status?.[key]||{status:'unavailable',message:'Data unavailable.'}}
 function factorValue(f){if(typeof f.value==='string')return esc(f.value);if(!finite(f.value))return'—';return `${number(f.value,1)}${f.unit?' '+esc(f.unit):''}`}
 function statusBanner(d){const state=d.data_status||{status:'unavailable',reasons:[]};if(state.status==='ready')return'';const messages=(state.reasons||[]).map(r=>esc(r.message)).join(' · ')||'One or more datasets are unavailable.';return `<article class="ai-card ai-insight"><div class="ai-cardpad"><h3>My Hub ${esc(state.status)}</h3><div style="font-size:12px">${messages}</div></div></article>`}
 async function load(w){
  $('#dashboard-grid').innerHTML='<div class="ai-card ai-insight ai-empty">Building Quick Props and matchup intelligence…</div>';
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
  try{const d=await fetchJSON(`/api/my-hub?season=${w.season}&week=${w.week}&type=${w.type}`,{signal:controller.signal});render(d)}
  catch(e){const msg=e?.name==='AbortError'?'My Hub timed out after 15 seconds. Refresh to retry.':`My Hub unavailable: ${esc(e.message)}`;$('#dashboard-grid').innerHTML=`<div class="ai-card ai-insight ai-empty">${msg}</div>`}
  finally{clearTimeout(timer)}
 }
 function render(d){
  const k=d.kpis||{},f=d.featured,q=d.quick_props||{},players=(q.picks?.length?q.picks:q.watchlist)||d.player_projections||[],ranks=d.team_rankings||[],games=d.upcoming_games||[],shown=f||games[0]||null;
  const factors=f?.factors||[],trends=d.trend||[],firstTrend=trends.find(t=>t.values?.length>1);
  const winStatus=kpiStatus(d,'win_probability'),confidenceStatus=kpiStatus(d,'prediction_confidence'),upsideStatus=kpiStatus(d,'upside_score'),edgeStatus=kpiStatus(d,'market_edge'),coverageStatus=kpiStatus(d,'data_coverage');
  const featureHtml=shown?`<div style="display:flex;justify-content:space-between;font-weight:800"><span>${teamLogo(shown.home_team,'tlogo-md')} ${esc(shown.home_team)}</span><span class="purple">${pct(shown.home_prob)}</span><span>${esc(shown.away_team)} ${teamLogo(shown.away_team,'tlogo-md')}</span></div><div class="ai-empty">${f?'Single pregame estimate shown. Probability history is not collected yet.':esc(shown.reason||'Prediction unavailable.')}</div>`:'<div class="ai-empty">No scheduled matchup is available for this selection.</div>';
  const estimateHtml=f?`<div class="ai-ring" style="--p:${Math.round(f.home_prob*100)}"><div><b>${pct(f.home_prob)}</b><span>${esc(f.home_team)} win</span></div></div><div style="display:flex;justify-content:space-between"><span><b>${number(f.projected_home,1)}</b> ${esc(f.home_team)}</span><span><b>${number(f.projected_away,1)}</b> ${esc(f.away_team)}</span></div><p class="muted" style="font-size:10px;margin-top:12px">No simulation was run for this card. Player prop decisions use the separate P3.5 simulation-confirmed delivery contract.</p>`:`<div class="ai-empty">${esc(winStatus.message||'Matchup estimate unavailable.')}</div>`;
  const factorsHtml=factors.length?factors.map(x=>`<div class="factor" style="grid-template-columns:1fr auto"><span>${esc(x.label)}<br><small class="muted">${esc(x.source)}</small></span><b>${factorValue(x)}</b></div>`).join(''):'<div class="ai-empty">Model inputs unavailable because no matchup has complete source data.</div>';
  const confidenceHtml=f?`<div class="ai-ring" style="--p:${Math.round(f.confidence*100)};width:82px;height:82px"><div><b style="font-size:19px">${pct(f.confidence)}</b><span>confidence</span></div></div>`:'';
  const gamesHtml=games.length?games.map(g=>{const score=finite(g.projected_away)&&finite(g.projected_home)?number(g.projected_away,1)+'-'+number(g.projected_home,1):esc(g.reason||'Prediction unavailable');return `<a class="game-mini" style="display:block;color:inherit;text-decoration:none" href="/game/${g.game_id}"><div class="teams"><span>${teamLogo(g.away_team)} ${esc(g.away_team)} @ ${teamLogo(g.home_team)} ${esc(g.home_team)}</span><span class="cyan">${pct(g.home_prob)}</span></div><div class="meta"><span>${new Date(g.date).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})}</span><span>${score}</span></div></a>`}).join(''):'<div class="ai-empty">No games this week.</div>';
  const stateLabel=q.state==='watchlist'?'WATCHLIST ONLY':String(q.state||'empty').toUpperCase();
  const playerRows=players.length?players.slice(0,8).map(p=>{const edgeClass=finite(p.edge)?(p.edge>=0?'positive':'negative'):'';const price=p.priceStatus==='unpriced'?'Model only':p.actionable?'Priced value':p.priceStatus||'Priced';return `<tr><td><div class="pcell">${headshot(p.playerId)}<a href="/player/${p.playerId}" style="color:inherit">${esc(p.player)}</a></div></td><td>${esc(p.marketLabel)}</td><td><b>${esc(p.side||'').toUpperCase()} ${number(p.line,1)}</b></td><td>${esc(p.decisionGrade||'Pass')}</td><td class="cyan">${pct(p.consensusProb)}</td><td>${pct(p.confidenceScore)}</td><td>${pct(p.simulationAgreement)}</td><td class="${edgeClass}">${finite(p.edge)?pc(p.edge):esc(price)}</td></tr>`}).join(''):`<tr><td colspan="8" class="ai-empty">${esc(q.message||d.data_status?.components?.player_projections?.message||'No Quick Props available.')}</td></tr>`;
  const quickHeader=`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px"><b>${esc(stateLabel)}</b><span class="muted">${esc(q.message||'')}</span><span class="cyan">${q.summary?.delivered??0} delivered · ${q.summary?.leanOrBetter??0} Lean+</span></div>`;
  const trendHtml=firstTrend?`<div class="ai-chart">${spark(firstTrend.values)}</div><div style="display:flex;gap:16px;font-size:10px;color:#8995b6">${trends.map(t=>`<span>● ${esc(t.team)}</span>`).join('')}</div>`:`<div class="ai-empty">${esc(d.data_status?.components?.trend_history?.message||'Trend history unavailable.')}</div>`;
  const rankingsHtml=ranks.length?`<table class="ai-data"><tbody>${ranks.slice(0,6).map((r,i)=>`<tr><td>${i+1}</td><td><div class="pcell">${teamLogo(r.team,'tlogo-md')}<div><b>${esc(r.team)}</b><br><span class="muted">${esc(r.record||'Record unavailable')}</span></div></div></td><td class="purple"><b>${number(r.power_score,1)}</b></td></tr>`).join('')}</tbody></table>`:'<div class="ai-empty">Team performance rankings unavailable.</div>';
  const engineVersion=$('#engine-version');if(engineVersion)engineVersion.textContent=d.engine.version;
  $('#dashboard-grid').innerHTML=`
  ${statusBanner(d)}
  ${[
   ['Quick Props',String(q.summary?.delivered??0),`${q.summary?.leanOrBetter??0} Lean-or-better model decisions`],
   ['AI win probability',pct(k.win_probability),f?`${esc(f.home_team)} vs ${esc(f.away_team)}`:esc(winStatus.message||'Unavailable')],
   ['Prediction confidence',pct(k.prediction_confidence),esc(confidenceStatus.message||'Transparent heuristic confidence')],
   ['Priced edge score',finite(k.upside_score)?number(k.upside_score,1)+'%':'—',esc(upsideStatus.message||'Positive model edge versus available price')],
   ['Edge over market',finite(k.market_edge)?pc(k.market_edge):'—',esc(edgeStatus.message||'Best available priced edge')],
   ['Data coverage',pct(d.engine.data_coverage),esc(coverageStatus.message||'Team performance feed')]
  ].map(x=>`<article class="ai-card ai-kpi"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="sub">${x[2]}</div></article>`).join('')}
  <article class="ai-card ai-tablecard"><div class="ai-cardpad"><h3>Quick Props</h3>${quickHeader}<table class="ai-data"><thead><tr><th>Player</th><th>Market</th><th>Pick</th><th>Decision</th><th>Pick P</th><th>Confidence</th><th>Sim agree</th><th>Price/value</th></tr></thead><tbody>${playerRows}</tbody></table></div></article>
  <article class="ai-card ai-feature"><div class="ai-cardpad"><h3>AI win probability</h3>${featureHtml}</div></article>
  <article class="ai-card ai-simulator"><div class="ai-cardpad"><h3>Matchup estimate</h3>${estimateHtml}</div></article>
  <article class="ai-card ai-factors"><div class="ai-cardpad"><h3>Model inputs</h3>${factorsHtml}${confidenceHtml}</div></article>
  <article class="ai-card ai-games"><div class="ai-cardpad"><h3>Upcoming games</h3>${gamesHtml}</div></article>
  <article class="ai-card ai-trend"><div class="ai-cardpad"><h3>Trend analysis</h3>${trendHtml}</div></article>
  <article class="ai-card ai-rankings"><div class="ai-cardpad"><h3>Team rankings</h3>${rankingsHtml}</div></article>
  <article class="ai-card ai-insight"><div class="ai-cardpad" style="display:flex;gap:18px;align-items:center"><div class="ai-mark">AI</div><div><h3 style="margin-bottom:5px">Decision delivery</h3><div style="font-size:12px">${esc(d.engine.model_note)}</div></div><div style="margin-left:auto" class="cyan">Updated ${new Date(d.generated_at).toLocaleTimeString()}</div></div></article>`
 }
});
</script></body></html>
