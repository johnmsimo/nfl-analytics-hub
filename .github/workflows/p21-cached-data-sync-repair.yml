name: P2.1 Cached Data Sync Repair

on:
  workflow_dispatch:
    inputs:
      confirm_mutation:
        description: Confirm this run may refresh the production warehouse from bundled cached NFL data
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - RUN_CACHED_DATA_SYNC

permissions:
  contents: read

concurrency:
  group: p21-cached-data-sync-repair
  cancel-in-progress: false

jobs:
  repair:
    if: inputs.confirm_mutation == 'RUN_CACHED_DATA_SYNC'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Validate repair controls
        run: test -n "$FLY_API_TOKEN" || (echo "Missing FLY_API_TOKEN repository secret" && exit 1)
      - name: Verify production readiness
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors \
            https://nfl-analytics-hub.fly.dev/ready \
            | python -c 'import json, sys; data = json.load(sys.stdin); assert data.get("ok") and data.get("database") == "ready" and data.get("schedule", {}).get("ready"), data'
      - name: Run cached-data sync repair
        shell: bash
        run: |
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app python /app/scripts/p21_cached_data_sync.py"
      - name: Run sanitized P2.1 preview
        shell: bash
        run: |
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app python /app/scripts/p21_production_preview.py"
