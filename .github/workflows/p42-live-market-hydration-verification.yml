name: P4.2 Live Market Hydration Verification

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Explicitly confirm live provider requests may consume Odds API credits
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - RUN_LIVE_GAME_MARKET_HYDRATE

permissions:
  contents: read

concurrency:
  group: p42-live-market-hydration-verification
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.confirmation == 'RUN_LIVE_GAME_MARKET_HYDRATE'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate explicit P4.2 live-spend controls
        shell: bash
        run: |
          test -n "$FLY_API_TOKEN" || (echo "Missing FLY_API_TOKEN repository secret" && exit 1)
          test "${{ inputs.confirmation }}" = "RUN_LIVE_GAME_MARKET_HYDRATE"
          echo "P4.2 is authorized for one bulk refresh, one catalog lookup when needed, and at most four targeted event-odds requests."

      - name: Verify production readiness
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          trap 'rm -f "$BODY"' EXIT
          set +e
          HTTP_CODE=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --output "$BODY" --write-out "%{http_code}" \
            https://nfl-analytics-hub.fly.dev/ready)
          CURL_RC=$?
          set -e
          echo "Public /ready HTTP status: ${HTTP_CODE:-unknown}"
          if [ -s "$BODY" ]; then
            python - "$BODY" <<'PY'
          import json, pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          try:
              print(json.dumps(json.loads(text), sort_keys=True, separators=(",", ":")))
          except json.JSONDecodeError:
              print(text[:1200])
          PY
          fi
          if [ "$CURL_RC" -ne 0 ] || [ "${HTTP_CODE:-000}" != "200" ]; then
            exit 1
          fi
          python - "$BODY" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload.get("ok"), payload
          assert payload.get("database") == "ready", payload
          assert payload.get("schedule", {}).get("ready"), payload
          PY

      - name: Run explicit live P4.2 hydration and persisted-board verification
        shell: bash
        run: |
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app python /app/scripts/p42_live_market_hydration_verification.py --season 2026 --week 1 --type REG --max-targeted 4 --min-priced-games 1"

      - name: Re-run sanitized P2/P3 safety verification
        shell: bash
        run: |
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app python /app/scripts/p2_exit_verification.py"
