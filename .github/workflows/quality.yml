name: Quality and Security

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Repository-wide Python correctness lint
        run: ruff check . --select E9,F63,F7,F82 --output-format=github
      - name: Strict lint modern production surfaces
        run: >-
          ruff check
          api_lifecycle.py
          database.py
          realtime_v32.py
          routes/current_api.py
          routes/v32_api.py
          routes/v32_release_api.py
          v32_release.py
      - name: Show canonical API formatter diff
        run: |
          ruff format --check api_lifecycle.py database.py realtime_v32.py routes/v32_api.py routes/v32_release_api.py v32_release.py
          ruff format --diff routes/current_api.py
          exit 1
      - run: mypy analytics_engine routes/analytics_api.py
      - run: bandit -q -r . -x tests,migrations,.venv --skip B101,B104,B105,B106,B110,B311,B324
      - run: pip-audit -r requirements.txt

  analytics-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest pytest-cov
      - name: Run complete analytics coverage suite
        run: >-
          pytest -q
          tests/test_analytics_engine.py
          tests/test_game_intelligence_v31.py
          tests/test_v31_platform.py
          tests/test_v31_coverage.py
          --cov=analytics_engine.platform_v31
          --cov=analytics_engine.intelligence_v31
          --cov=analytics_engine.models
          --cov-fail-under=90
