name: P5.6 Game Market Calibration Control Plane Verification

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Confirm zero-credit, zero-write P5.6 market control-plane verification
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - RUN_GAME_MARKET_CALIBRATION_CONTROL_PLANE_VERIFY

permissions:
  contents: read

concurrency:
  group: p56-game-market-calibration-control-plane-verification
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.confirmation == 'RUN_GAME_MARKET_CALIBRATION_CONTROL_PLANE_VERIFY'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate P5.6 zero-credit market control-plane controls
        shell: bash
        run: |
          test -n "$FLY_API_TOKEN" || (echo "Missing FLY_API_TOKEN repository secret" && exit 1)
          test "${{ inputs.confirmation }}" = "RUN_GAME_MARKET_CALIBRATION_CONTROL_PLANE_VERIFY"
          grep -q 'automaticPromotion.*False' p56_game_market_calibration_control_plane.py
          grep -q 'automaticRollback.*False' p56_game_market_calibration_control_plane.py
          grep -q 'providerRequests.*0' p56_game_market_calibration_control_plane.py
          grep -q 'marketIsolated.*True' p56_game_market_calibration_control_plane.py
          grep -q 'ownerConfirmationRequired.*True' p56_game_market_calibration_control_plane.py
          grep -q 'REVIEW_MARKET_PROMOTION' p56_game_market_calibration_control_plane.py
          grep -q 'REVIEW_MARKET_ROLLBACK' p56_game_market_calibration_control_plane.py

      - name: Verify production readiness
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          trap 'rm -f "$BODY"' EXIT
          set +e
          HTTP_CODE=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --output "$BODY" --write-out "%{http_code}" \
            https://nfl-analytics-hub.fly.dev/ready)
          CURL_RC=$?
          set -e
          echo "Public /ready HTTP status: ${HTTP_CODE:-unknown}"
          if [ -s "$BODY" ]; then
            cat "$BODY"
            echo
          fi
          if [ "$CURL_RC" -ne 0 ] || [ "${HTTP_CODE:-000}" != "200" ]; then
            exit 1
          fi
          python - "$BODY" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload.get("ok"), payload
          assert payload.get("database") == "ready", payload
          assert payload.get("schedule", {}).get("ready"), payload
          PY

      - name: Run sanitized P5.6 market calibration control plane verification
        shell: bash
        run: |
          # Reads P5.4/P5.5 governance plus immutable production evidence only.
          # Synthetic decisions are pure in-memory. No provider refresh,
          # promotion/rollback write, ledger write, Tracker write, or bet execution.
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app python /app/scripts/p56_game_market_calibration_control_plane_verification.py"

      - name: Re-run sanitized P2/P3 safety verification
        shell: bash
        run: |
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app python /app/scripts/p2_exit_verification.py"
