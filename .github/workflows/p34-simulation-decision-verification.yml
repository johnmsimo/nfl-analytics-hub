name: P3.4 Simulation Decision Verification

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Confirm a read-only P3.4 production decision verification
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - RUN_SIMULATION_DECISION_VERIFY

permissions:
  contents: read

concurrency:
  group: p34-simulation-decision-verification
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.confirmation == 'RUN_SIMULATION_DECISION_VERIFY'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      P34_TARGET_SEASON: '2026'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate P3.4 read-only controls
        run: |
          test -n "$FLY_API_TOKEN" || (echo "Missing FLY_API_TOKEN repository secret" && exit 1)
          test "${{ inputs.confirmation }}" = "RUN_SIMULATION_DECISION_VERIFY"

      - name: Verify production readiness
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors \
            https://nfl-analytics-hub.fly.dev/ready \
            | python -c 'import json, sys; data=json.load(sys.stdin); schedule=data.get("schedule", {}); current=schedule.get("current_week", {}); assert data.get("ok") and data.get("database") == "ready" and schedule.get("ready") and current.get("season") == 2026, data'

      - name: Run sanitized P3.4 simulation decision verification
        shell: bash
        run: |
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app P34_TARGET_SEASON=2026 python /app/scripts/p34_simulation_decision_verification.py"

      - name: Re-run sanitized P2/P3 safety verification
        shell: bash
        run: |
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app python /app/scripts/p2_exit_verification.py"
