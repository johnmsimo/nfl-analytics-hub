name: P4.6 Game Portfolio Verification

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Confirm zero-credit P4.6 bankroll portfolio verification
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - RUN_GAME_PORTFOLIO_VERIFY

permissions:
  contents: read

concurrency:
  group: p46-game-portfolio-verification
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.confirmation == 'RUN_GAME_PORTFOLIO_VERIFY'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate P4.6 zero-credit controls
        shell: bash
        run: |
          test -n "$FLY_API_TOKEN" || (echo "Missing FLY_API_TOKEN repository secret" && exit 1)
          test "${{ inputs.confirmation }}" = "RUN_GAME_PORTFOLIO_VERIFY"
          grep -q 'automaticBetPlacement.*False' p46_game_portfolio.py
          grep -q 'providerIo.*False' p46_game_portfolio.py

      - name: Verify production readiness
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          trap 'rm -f "$BODY"' EXIT
          set +e
          HTTP_CODE=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --output "$BODY" --write-out "%{http_code}" \
            https://nfl-analytics-hub.fly.dev/ready)
          CURL_RC=$?
          set -e
          echo "Public /ready HTTP status: ${HTTP_CODE:-unknown}"
          if [ -s "$BODY" ]; then
            python - "$BODY" <<'PY'
          import json, pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          try:
              print(json.dumps(json.loads(text), sort_keys=True, separators=(",", ":")))
          except json.JSONDecodeError:
              print(text[:1200])
          PY
          fi
          if [ "$CURL_RC" -ne 0 ] || [ "${HTTP_CODE:-000}" != "200" ]; then
            exit 1
          fi
          python - "$BODY" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload.get("ok"), payload
          assert payload.get("database") == "ready", payload
          assert payload.get("schedule", {}).get("ready"), payload
          PY

      - name: Run sanitized P4.6 bankroll portfolio verification
        shell: bash
        run: |
          # Cache/opportunity reads only. No provider refresh and no bet placement.
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app python /app/scripts/p46_game_portfolio_verification.py"

      - name: Re-run sanitized P2/P3 safety verification
        shell: bash
        run: |
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app python /app/scripts/p2_exit_verification.py"
