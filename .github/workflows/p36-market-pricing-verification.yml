name: P3.6 Market Pricing Verification

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Select cache-only verification or explicitly refresh one top-pick event first (refresh may consume Odds API credits)
        required: true
        default: RUN_CACHE_ONLY_VERIFY
        type: choice
        options:
          - RUN_CACHE_ONLY_VERIFY
          - RUN_ONE_EVENT_PRICE_REFRESH_VERIFY

permissions:
  contents: read

concurrency:
  group: p36-market-pricing-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      P36_TARGET_SEASON: '2026'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate P3.6 controls
        shell: bash
        run: |
          test -n "$FLY_API_TOKEN" || (echo "Missing FLY_API_TOKEN repository secret" && exit 1)
          case "${{ inputs.confirmation }}" in
            RUN_CACHE_ONLY_VERIFY|RUN_ONE_EVENT_PRICE_REFRESH_VERIFY) ;;
            *) echo "Unsupported confirmation"; exit 1 ;;
          esac

      - name: Verify production readiness
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          trap 'rm -f "$BODY"' EXIT

          set +e
          HTTP_CODE=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --output "$BODY" --write-out "%{http_code}" \
            https://nfl-analytics-hub.fly.dev/ready)
          CURL_RC=$?
          set -e

          echo "Public /ready HTTP status: ${HTTP_CODE:-unknown}"
          if [ -s "$BODY" ]; then
            echo "Sanitized public /ready response:"
            python - "$BODY" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8", errors="replace")
          try:
              payload = json.loads(text)
              print(json.dumps(payload, sort_keys=True, separators=(",", ":")))
          except json.JSONDecodeError:
              print(text[:1200])
          PY
          else
            echo "Public /ready returned an empty body."
          fi

          if [ "$CURL_RC" -ne 0 ] || [ "${HTTP_CODE:-000}" != "200" ]; then
            echo "Public readiness failed; running internal Fly readiness diagnostic."
            flyctl ssh console --app nfl-analytics-hub --command \
              "/usr/bin/env PYTHONPATH=/app python -c 'from app import app; c=app.test_client(); r=c.get(\"/ready\"); print(\"internal_ready_status=\" + str(r.status_code)); print(r.get_data(as_text=True))'" \
              || true
            exit 1
          fi

          python - "$BODY" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload.get("ok"), payload
          assert payload.get("database") == "ready", payload
          assert payload.get("schedule", {}).get("ready"), payload
          PY

      - name: Run sanitized P3.6 market pricing verification
        shell: bash
        run: |
          if [ "${{ inputs.confirmation }}" = "RUN_ONE_EVENT_PRICE_REFRESH_VERIFY" ]; then
            MODE=one-event
          else
            MODE=cache
          fi
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app P36_TARGET_SEASON=2026 P36_REFRESH_MODE=$MODE python /app/scripts/p36_market_pricing_verification.py"

      - name: Re-run sanitized P2/P3 safety verification
        shell: bash
        run: |
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app python /app/scripts/p2_exit_verification.py"
