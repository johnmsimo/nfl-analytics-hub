name: P3.6 Market Pricing Verification

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Select cache-only verification or explicitly refresh one top-pick event first (refresh may consume Odds API credits)
        required: true
        default: RUN_CACHE_ONLY_VERIFY
        type: choice
        options:
          - RUN_CACHE_ONLY_VERIFY
          - RUN_ONE_EVENT_PRICE_REFRESH_VERIFY

permissions:
  contents: read

concurrency:
  group: p36-market-pricing-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      P36_TARGET_SEASON: '2026'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate P3.6 controls
        shell: bash
        run: |
          test -n "$FLY_API_TOKEN" || (echo "Missing FLY_API_TOKEN repository secret" && exit 1)
          case "${{ inputs.confirmation }}" in
            RUN_CACHE_ONLY_VERIFY|RUN_ONE_EVENT_PRICE_REFRESH_VERIFY) ;;
            *) echo "Unsupported confirmation"; exit 1 ;;
          esac

      - name: Verify production readiness
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors \
            https://nfl-analytics-hub.fly.dev/ready \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") and d.get("database")=="ready" and d.get("schedule",{}).get("ready"), d'

      - name: Run sanitized P3.6 market pricing verification
        shell: bash
        run: |
          if [ "${{ inputs.confirmation }}" = "RUN_ONE_EVENT_PRICE_REFRESH_VERIFY" ]; then
            MODE=one-event
          else
            MODE=cache
          fi
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app P36_TARGET_SEASON=2026 P36_REFRESH_MODE=$MODE python /app/scripts/p36_market_pricing_verification.py"

      - name: Re-run sanitized P2/P3 safety verification
        shell: bash
        run: |
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app python /app/scripts/p2_exit_verification.py"
