name: P3.7 Decision Ledger Verification

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Confirm a read-only P3.7 persistence and ledger verification
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - RUN_DECISION_LEDGER_VERIFY

permissions:
  contents: read

concurrency:
  group: p37-decision-ledger-verification
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.confirmation == 'RUN_DECISION_LEDGER_VERIFY'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate P3.7 read-only controls
        shell: bash
        run: |
          test -n "$FLY_API_TOKEN" || (echo "Missing FLY_API_TOKEN repository secret" && exit 1)
          test "${{ inputs.confirmation }}" = "RUN_DECISION_LEDGER_VERIFY"

      - name: Verify production readiness
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          trap 'rm -f "$BODY"' EXIT

          set +e
          HTTP_CODE=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --output "$BODY" --write-out "%{http_code}" \
            https://nfl-analytics-hub.fly.dev/ready)
          CURL_RC=$?
          set -e

          echo "Public /ready HTTP status: ${HTTP_CODE:-unknown}"
          if [ -s "$BODY" ]; then
            echo "Sanitized public /ready response:"
            python - "$BODY" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8", errors="replace")
          try:
              payload = json.loads(text)
              print(json.dumps(payload, sort_keys=True, separators=(",", ":")))
          except json.JSONDecodeError:
              print(text[:1200])
          PY
          else
            echo "Public /ready returned an empty body."
          fi

          if [ "$CURL_RC" -ne 0 ] || [ "${HTTP_CODE:-000}" != "200" ]; then
            echo "Public readiness failed; running internal Fly readiness diagnostic."
            flyctl ssh console --app nfl-analytics-hub --command \
              "/usr/bin/env PYTHONPATH=/app python -c 'from app import app; c=app.test_client(); r=c.get(\"/ready\"); print(\"internal_ready_status=\" + str(r.status_code)); print(r.get_data(as_text=True))'" \
              || true
            exit 1
          fi

          python - "$BODY" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload.get("ok"), payload
          assert payload.get("database") == "ready", payload
          assert payload.get("schedule", {}).get("ready"), payload
          PY

      - name: Run sanitized P3.7 decision ledger verification
        shell: bash
        run: |
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app python /app/scripts/p37_decision_ledger_verification.py"

      - name: Re-run sanitized P2/P3 safety verification
        shell: bash
        run: |
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app python /app/scripts/p2_exit_verification.py"
