name: P4.8 Game Learning Verification

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Confirm zero-credit, read-only P4.8 game learning verification
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - RUN_GAME_LEARNING_VERIFY

permissions:
  contents: read

concurrency:
  group: p48-game-learning-verification
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.confirmation == 'RUN_GAME_LEARNING_VERIFY'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate P4.8 zero-credit read-only controls
        shell: bash
        run: |
          test -n "$FLY_API_TOKEN" || (echo "Missing FLY_API_TOKEN repository secret" && exit 1)
          test "${{ inputs.confirmation }}" = "RUN_GAME_LEARNING_VERIFY"
          grep -q 'providerRequests.*0' p48_game_learning.py
          grep -q 'changesModelProbabilities.*False' p48_game_learning.py
          grep -q 'automaticPromotion.*False' p48_game_learning.py
          ! grep -q 'hydrate_week' scripts/p48_game_learning_verification.py

      - name: Verify production readiness
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          trap 'rm -f "$BODY"' EXIT
          set +e
          HTTP_CODE=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --output "$BODY" --write-out "%{http_code}" \
            https://nfl-analytics-hub.fly.dev/ready)
          CURL_RC=$?
          set -e
          echo "Public /ready HTTP status: ${HTTP_CODE:-unknown}"
          if [ -s "$BODY" ]; then
            python - "$BODY" <<'PY'
          import json, pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          try:
              print(json.dumps(json.loads(text), sort_keys=True, separators=(",", ":")))
          except json.JSONDecodeError:
              print(text[:1200])
          PY
          fi
          if [ "$CURL_RC" -ne 0 ] || [ "${HTTP_CODE:-000}" != "200" ]; then
            exit 1
          fi
          python - "$BODY" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload.get("ok"), payload
          assert payload.get("database") == "ready", payload
          assert payload.get("schedule", {}).get("ready"), payload
          PY

      - name: Run sanitized P4.8 game learning verification
        shell: bash
        run: |
          # Immutable ledger reads + synthetic calibration samples only.
          # No odds refresh, Tracker write, ledger mutation, model update, or bet execution.
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app python /app/scripts/p48_game_learning_verification.py"

      - name: Re-run sanitized P2/P3 safety verification
        shell: bash
        run: |
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app python /app/scripts/p2_exit_verification.py"
