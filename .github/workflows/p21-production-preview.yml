name: P2.1 Production Preview

on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: Confirm this run may inspect sanitized production counts without changing data
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - RUN_READ_ONLY_PREVIEW

permissions:
  contents: read

concurrency:
  group: p21-production-preview
  cancel-in-progress: false

jobs:
  preview:
    if: inputs.confirm_read_only == 'RUN_READ_ONLY_PREVIEW'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Validate read-only controls
        run: test -n "$FLY_API_TOKEN" || (echo "Missing FLY_API_TOKEN repository secret" && exit 1)
      - name: Verify production readiness
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors \
            https://nfl-analytics-hub.fly.dev/ready \
            | python -c 'import json, sys; data = json.load(sys.stdin); assert data.get("ok") and data.get("database") == "ready" and data.get("schedule", {}).get("ready"), data'
      - name: Run sanitized P2.1 preview
        shell: bash
        run: |
          flyctl ssh console --app nfl-analytics-hub --command \
            "cd /app && PYTHONPATH=/app python scripts/p21_production_preview.py"
