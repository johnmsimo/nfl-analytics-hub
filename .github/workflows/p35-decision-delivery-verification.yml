name: P3.5 Decision Delivery Verification

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Confirm a read-only P3.5 production delivery verification
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - RUN_DECISION_DELIVERY_VERIFY

permissions:
  contents: read

concurrency:
  group: p35-decision-delivery-verification
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.confirmation == 'RUN_DECISION_DELIVERY_VERIFY'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      P35_TARGET_SEASON: '2026'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate P3.5 read-only controls
        run: |
          test -n "$FLY_API_TOKEN" || (echo "Missing FLY_API_TOKEN repository secret" && exit 1)
          test "${{ inputs.confirmation }}" = "RUN_DECISION_DELIVERY_VERIFY"

      - name: Verify production readiness
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors \
            https://nfl-analytics-hub.fly.dev/ready \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") and d.get("database")=="ready" and d.get("schedule",{}).get("ready"), d'

      - name: Run sanitized P3.5 decision delivery verification
        shell: bash
        run: |
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app P35_TARGET_SEASON=2026 python /app/scripts/p35_decision_delivery_verification.py"

      - name: Re-run sanitized P2/P3 safety verification
        shell: bash
        run: |
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app python /app/scripts/p2_exit_verification.py"
