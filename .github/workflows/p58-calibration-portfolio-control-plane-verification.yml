name: P5.8 Calibration Portfolio Control Plane Verification

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Confirm zero-credit, zero-write P5.8 portfolio verification
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - RUN_CALIBRATION_PORTFOLIO_VERIFY

permissions:
  contents: read

concurrency:
  group: p58-calibration-portfolio-control-plane-verification
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.confirmation == 'RUN_CALIBRATION_PORTFOLIO_VERIFY'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate P5.8 zero-credit portfolio controls
        shell: bash
        run: |
          test -n "$FLY_API_TOKEN" || (echo "Missing FLY_API_TOKEN repository secret" && exit 1)
          test "${{ inputs.confirmation }}" = "RUN_CALIBRATION_PORTFOLIO_VERIFY"
          grep -q 'delegatesMoneylineGatesToP52.*True' p58_calibration_portfolio_control_plane.py
          grep -q 'delegatesSpreadTotalGatesToP56.*True' p58_calibration_portfolio_control_plane.py
          grep -q 'providerRequests.*0' p58_calibration_portfolio_control_plane.py
          grep -q 'automaticPromotion.*False' p58_calibration_portfolio_control_plane.py
          grep -q 'automaticRollback.*False' p58_calibration_portfolio_control_plane.py
          grep -q 'placesBets.*False' p58_calibration_portfolio_control_plane.py

      - name: Verify production readiness
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          trap 'rm -f "$BODY"' EXIT
          set +e
          HTTP_CODE=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --output "$BODY" --write-out "%{http_code}" \
            https://nfl-analytics-hub.fly.dev/ready)
          CURL_RC=$?
          set -e
          echo "Public /ready HTTP status: ${HTTP_CODE:-unknown}"
          if [ -s "$BODY" ]; then
            cat "$BODY"
            echo
          fi
          if [ "$CURL_RC" -ne 0 ] || [ "${HTTP_CODE:-000}" != "200" ]; then
            exit 1
          fi
          python - "$BODY" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload.get("ok"), payload
          assert payload.get("database") == "ready", payload
          assert payload.get("schedule", {}).get("ready"), payload
          PY

      - name: Run sanitized P5.8 all-market calibration portfolio verification
        shell: bash
        run: |
          # Reads canonical P5.2/P5.6 control planes plus immutable verification evidence.
          # Synthetic portfolio states are pure in-memory. No provider refresh,
          # promotion/rollback write, ledger write, Tracker write, or bet execution.
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app python /app/scripts/p58_calibration_portfolio_control_plane_verification.py"

      - name: Re-run sanitized P2/P3 safety verification
        shell: bash
        run: |
          flyctl ssh console --app nfl-analytics-hub --command \
            "/usr/bin/env PYTHONPATH=/app python /app/scripts/p2_exit_verification.py"
