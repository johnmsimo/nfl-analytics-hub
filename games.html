<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Games · NFL Analytics Hub</title><link rel="stylesheet" href="/static/theme.css"><script src="/static/app.js" defer></script><style>
.game-pick{margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(15,23,42,.4)}.game-pick.actionable{border-color:rgba(34,197,94,.48);background:rgba(34,197,94,.05)}.game-pick-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.game-pick-label{font-weight:800;font-size:13px}.game-pick-badge{font-size:9px;font-weight:800;padding:3px 7px;border-radius:999px;border:1px solid var(--line);color:var(--warn)}.game-pick-badge.actionable{color:var(--g);border-color:rgba(34,197,94,.4)}.game-pick-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.game-pick-metrics span{font-size:9px;color:var(--mu)}.game-pick-metrics b{display:block;font-size:11px;color:var(--fg)}@media(max-width:520px){.game-pick-metrics{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap"><section class="ai-page"><header class="ai-pagehead"><div><h1>Games</h1><p>Weekly slate with P4.3 decision-first moneyline, spread, and total recommendations.</p></div><div class="ai-controls" id="controls"></div></header><div id="summary" class="directory-kpis"></div><div id="games-grid" class="directory-card-grid"><div class="ai-card ai-empty">Loading games…</div></div></section></main><script>
document.addEventListener('DOMContentLoaded',async()=>{const{$,esc,pc,fetchJSON,shell,weekControls,teamLogo}=NFLHub;shell('games');await weekControls($('#controls'),load);
function finite(v){return v!==null&&v!==''&&Number.isFinite(Number(v))}function pct(v){return finite(v)?Math.round(Number(v)*100)+'%':'—'}function american(v){if(!finite(v))return'—';const n=Number(v);return n>0?`+${n}`:`${n}`}
function pickForGame(board,gid){const picks=(board.picks||[]).filter(x=>String(x.gameId)===String(gid));if(picks.length)return picks[0];const watch=(board.watchlist||[]).filter(x=>String(x.gameId)===String(gid));if(watch.length)return watch[0];const all=(board.allMarkets||[]).filter(x=>String(x.gameId)===String(gid)&&x.quoteStatus==='fresh');return all[0]||null}
function pickHtml(p){if(!p)return'<div class="game-pick"><span class="muted">No verified game-market decision available.</span></div>';return `<div class="game-pick ${p.actionable?'actionable':''}"><div class="game-pick-head"><div><span class="game-pick-badge ${p.actionable?'actionable':''}">${p.actionable?'ACTIONABLE':'WATCH'}</span><div class="game-pick-label">${esc(p.pickLabel)}</div></div><b>${esc(p.decisionGrade||'Pass')}</b></div><div class="game-pick-metrics"><span>Model P<b>${pct(p.modelProbability)}</b></span><span>Edge<b class="${finite(p.edge)&&p.edge>0?'positive':''}">${finite(p.edge)?pc(p.edge):'—'}</b></span><span>EV<b class="${finite(p.evPct)&&p.evPct>0?'positive':''}">${finite(p.evPct)?pc(p.evPct):'—'}</b></span><span>Best price<b>${american(p.bestPrice)} · ${esc(p.bestBook||'—')}</b></span></div></div>`}
async function load(w){$('#games-grid').innerHTML='<div class="ai-card ai-empty">Loading weekly slate and verified game decisions…</div>';try{const [d,board]=await Promise.all([fetchJSON(`/api/games/week?season=${w.season}&week=${w.week}&type=${w.type}`),fetchJSON(`/api/game-decision-board/week?season=${w.season}&week=${w.week}&type=${w.type}`)]);render(d,board)}catch(e){$('#games-grid').innerHTML=`<div class="ai-card ai-empty">${esc(e.message)}</div>`}}
function render(d,board){const games=d.games||[];const completed=games.filter(g=>g.completed).length;const live=games.filter(g=>g.status&&g.status!=='STATUS_SCHEDULED'&&!g.completed).length;const s=board.summary||{};$('#summary').innerHTML=[['Games',games.length],['Actionable games',s.actionableGames??0],['Actionable markets',s.actionableMarkets??0],['Fresh priced',s.freshPricedGames??0],['Completed',completed],['Live',live]].map(x=>`<div class="ai-card directory-kpi"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');$('#games-grid').innerHTML=games.length?games.map(g=>{const p=pickForGame(board,g.game_id);return `<a class="ai-card game-directory-card" href="/game/${g.game_id}?season=${d.season}"><div class="game-directory-date">${new Date(g.date).toLocaleString([],{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div><div class="game-directory-matchup"><span><b>${teamLogo(g.away_team)} ${esc(g.away_team)}</b><small>${esc(g.away_summary?.record||'—')} · ${g.away_summary?.ppg||'—'} PPG</small></span><strong>${g.away_score??'@'}</strong></div><div class="game-directory-matchup"><span><b>${teamLogo(g.home_team)} ${esc(g.home_team)}</b><small>${esc(g.home_summary?.record||'—')} · ${g.home_summary?.ppg||'—'} PPG</small></span><strong>${g.home_score??''}</strong></div>${pickHtml(p)}<div class="game-directory-foot"><span>${esc(g.status_detail||g.status||'Scheduled')}</span><span class="${p?.actionable?'positive':p?'cyan':'muted'}">${p?.actionable?'Verified value':p?'Model watch':'No decision'}</span></div></a>`}).join(''):'<div class="ai-card ai-empty">No games found for this week.</div>'}
});
</script></body></html>
